
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f5ec">
    <title>Log In | Pawprints of Hope</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="login-page">
    <header th:replace="~{layout/base :: header}"></header>

    <main class="auth-section">
        <section class="auth-card">
            <p class="landing-eyebrow">WELCOME BACK</p>

            <h1>Welcome home.</h1>

            <p class="auth-card__intro">Sign in to continue your pet adoption journey.</p>

            <p class="auth-message auth-message--success" th:if="${param.registered}" role="status">
                Your account was created successfully. You can now log in.
            </p>

            <p class="auth-message auth-message--error" th:if="${param.error}" role="alert">
                Invalid email or password. Please try again.
            </p>

            <p class="auth-message auth-message--success" th:if="${param.logout}" role="status">
                You have been logged out successfully.
            </p>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input type="email"
                           id="email"
                           name="email"
                           autocomplete="email"
                           required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input type="password"
                           id="password"
                           name="password"
                           autocomplete="current-password"
                           required>
                </div>

                <button type="submit" class="primary-button">
                    Log In
                </button>
            </form>

            <p class="auth-card__switch">
                Don't have an account?
                <a th:href="@{/register}">Create an account</a>
            </p>

            <a class="auth-card__home" th:href="@{/}">← Back to home</a>
        </section>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
