<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f5ec">
    <title>Thank You | Pawprints of Hope</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="donation-confirmation-page">
    <header th:replace="~{layout/base :: header}"></header>

    <main class="donation-confirmation" aria-labelledby="donation-thanks-title">
        <section class="donation-confirmation__card">
            <div class="donation-confirmation__icon" aria-hidden="true">✓</div>
            <p class="landing-eyebrow">THANK YOU FOR CARING</p>
            <h1 id="donation-thanks-title">Your kindness means a lot.</h1>
            <p class="donation-confirmation__lead">Your donation details have been sent to our team. Your support helps provide care for pets waiting to meet their families.</p>

            <div class="donation-confirmation__status" role="status">
                <span class="donation-confirmation__status-dot" aria-hidden="true"></span>
                <span><strong>Pending verification</strong><br>We’ll review your payment proof before confirming your donation.</span>
            </div>

            <div class="donation-confirmation__actions">
                <a th:href="@{/pets}" class="primary-button">Meet our pets <span aria-hidden="true">→</span></a>
                <a th:href="@{/}" class="donation-confirmation__home">Back to home</a>
            </div>
        </section>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
