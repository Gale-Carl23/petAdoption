
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f5ec">
    <title>Create Account | Pawprints of Hope</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="register-page">
    <header th:replace="~{layout/base :: header}"></header>

    <main class="auth-section">
        <section class="auth-card">
            <p class="landing-eyebrow">A NEW CHAPTER STARTS HERE</p>

            <h1>Join our community.</h1>

            <p class="auth-card__intro">Create an account to apply to adopt and follow your application updates.</p>

            <p class="auth-message auth-message--error"
               th:if="${registrationError}"
               th:text="${registrationError}"
               role="alert"></p>

            <form th:action="@{/register}"
                  th:object="${registrationForm}"
                  method="post">

                <div class="form-group">
                    <label for="fullName">Full Name</label>

                    <input type="text"
                           id="fullName"
                           th:field="*{fullName}"
                           autocomplete="name"
                           required>

                    <p th:if="${#fields.hasErrors('fullName')}"
                       class="auth-field-error"
                       th:errors="*{fullName}"></p>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           autocomplete="email"
                           required>

                    <p th:if="${#fields.hasErrors('email')}"
                       class="auth-field-error"
                       th:errors="*{email}"></p>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input type="password"
                           id="password"
                           th:field="*{password}"
                           autocomplete="new-password"
                           minlength="8"
                           maxlength="72"
                           required>

                    <p class="auth-field-hint">Use at least 8 characters.</p>

                    <p th:if="${#fields.hasErrors('password')}"
                       class="auth-field-error"
                       th:errors="*{password}"></p>
                </div>

                <button type="submit" class="primary-button">
                    Create Account
                </button>
            </form>

            <p class="auth-card__switch">
                Already have an account?
                <a th:href="@{/login}">Log in</a>
            </p>

            <a class="auth-card__home" th:href="@{/}">← Back to home</a>
        </section>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
