
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet a Pet | Pawprints of Hope</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <header th:replace="~{layout/base :: header}"></header>

    <main>
        <section class="pet-details-section" aria-label="Pet details">
            <div class="pet-details-back">
                <a class="pet-details-back__link" th:href="@{/pets}">
                    <span class="pet-details-back__arrow" aria-hidden="true">←</span>
                    <span>Back to all pets</span>
                </a>
            </div>

            <div class="pet-details-card">
                <div class="pet-placeholder"
                     th:if="${pet.imageUrl == null or #strings.isEmpty(pet.imageUrl)}"
                     aria-hidden="true">🐾</div>

                <img th:if="${pet.imageUrl != null and !#strings.isEmpty(pet.imageUrl)}"
                     th:src="${pet.imageUrl}"
                     th:alt="${pet.name}">

                <div class="pet-info">
                    <p class="eyebrow">MEET YOUR NEW BEST FRIEND</p>

                    <h1 th:text="${pet.name}">Pet Name</h1>
                    <p th:text="'Breed: ' + ${pet.breed}">Breed</p>
                    <p th:text="${pet.age} + ' year(s) old'">Age</p>
                    <p th:text="${pet.description}">Pet description</p>

                    <p>
                        Status:
                        <span th:text="${pet.status}">AVAILABLE</span>
                    </p>

                    <div th:if="${pet.status == 'AVAILABLE'}">
                        <span th:if="${hasApplied}">
                            <button type="button" disabled>Applied</button>
                        </span>

                        <a th:unless="${hasApplied}"
                           th:href="@{/adoptions/apply/{petId}(petId=${pet.id})}">
                            Apply to Adopt
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>

</body>
</html>
