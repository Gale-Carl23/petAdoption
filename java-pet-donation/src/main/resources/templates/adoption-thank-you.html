
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Submitted | Pet Haven</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <header th:replace="~{layout/base :: header}"></header>

    <main class="thank-you-card">
        <h1>Thank You for Applying!</h1>

        <p>
            Your adoption application has been submitted successfully.
        </p>

        <p>
            Our team will review your application. Submission does not
            guarantee adoption; we will update you when a decision is made.
        </p>

        <a class="primary-button" th:href="@{/pets}">
            Browse More Pets
        </a>

        <a class="secondary-button" th:href="@{/}">
            Return Home
        </a>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>

</body>
</html>
