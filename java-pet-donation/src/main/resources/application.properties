spring.application.name=pet-donation

# PostgreSQL datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=1500000
# Flyway owns the production schema; Hibernate validates mappings on startup.
spring.flyway.enabled=true
# Donation proofs use private S3 in AWS and local disk for local development.
app.upload.s3-bucket=${DONATION_PROOF_BUCKET:}
app.upload.s3-prefix=${DONATION_PROOF_PREFIX:donation-proofs}
app.aws.region=${AWS_REGION:ap-southeast-1}
# Merchant payment destinations are injected at runtime and are never committed here.
app.payment.gcash.recipient-name=${GCASH_RECIPIENT_NAME:}
app.payment.gcash.recipient-number=${GCASH_RECIPIENT_NUMBER:}
app.payment.bank.name=${BANK_NAME:}
app.payment.bank.account-name=${BANK_ACCOUNT_NAME:}
app.payment.bank.account-number=${BANK_ACCOUNT_NUMBER:}
app.payment.qrph.image-url=${QRPH_IMAGE_URL:}
# Health probes are used by the load balancer and container orchestrator.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
# Donation proof upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
